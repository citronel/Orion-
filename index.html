<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070a12">
  <meta name="description" content="ORION — a lightweight personal assistant.">
  <title>ORION — Personal Assistant</title>
  <style>
    /* ==============================
       ORION — styles
       ============================== */
    :root {
      color-scheme: dark;
      --bg: #070a12;
      --surface: #0c111d;
      --surface-raised: #101725;
      --line: rgba(159, 184, 218, .12);
      --text: #edf5ff;
      --muted: #8290a6;
      --cyan: #66e4f2;
      --blue: #638aff;
      --user: #111d30;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { min-height: 100%; background: var(--bg); }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(ellipse at 50% 7%, rgba(32, 71, 133, .16), transparent 34rem),
        var(--bg);
      -webkit-font-smoothing: antialiased;
    }
    button, input { font: inherit; }
    button { color: inherit; }

    .app-shell {
      width: min(100% - 32px, 760px);
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      padding: max(20px, env(safe-area-inset-top, 0px)) 0 calc(18px + var(--safe-bottom));
    }
    .topbar {
      min-height: 38px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand-mark {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: #dce8f8;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .19em;
    }
    .brand-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 12px rgba(102, 228, 242, .72);
    }
    .availability {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .02em;
    }
    .availability::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #63d8b2;
      box-shadow: 0 0 9px rgba(99, 216, 178, .45);
    }

    .hero {
      flex: 0 0 auto;
      min-height: 300px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 18px 0 20px;
      text-align: center;
    }
    .orb-stage {
      position: relative;
      width: 150px;
      height: 150px;
      display: grid;
      place-items: center;
      margin-bottom: 15px;
      isolation: isolate;
    }
    .orb-halo {
      position: absolute;
      z-index: -1;
      inset: 14px;
      border-radius: 50%;
      background: rgba(45, 154, 223, .18);
      filter: blur(26px);
      animation: halo-breathe 5s ease-in-out infinite;
    }
    .orb {
      position: relative;
      width: 104px;
      height: 104px;
      overflow: hidden;
      border: 1px solid rgba(148, 225, 255, .5);
      border-radius: 50%;
      background:
        radial-gradient(circle at 34% 27%, rgba(220, 255, 255, .95) 0, rgba(125, 229, 248, .9) 4%, transparent 18%),
        radial-gradient(ellipse at 37% 34%, #39cbe9 0, #197bc4 28%, #152d72 60%, #090f27 78%);
      box-shadow: inset -12px -15px 25px rgba(1, 5, 23, .62), inset 5px 5px 17px rgba(180, 246, 255, .25), 0 0 24px rgba(60, 186, 239, .27), 0 0 55px rgba(48, 101, 229, .12);
      animation: orb-float 5s ease-in-out infinite;
    }
    .orb::before, .orb::after {
      content: "";
      position: absolute;
      inset: -35%;
      border-radius: 42%;
      background: linear-gradient(105deg, transparent 38%, rgba(115, 239, 250, .4) 48%, rgba(101, 149, 255, .2) 53%, transparent 64%);
      transform: rotate(-25deg);
      animation: orb-current 8s linear infinite;
    }
    .orb::after {
      inset: 12% -42%;
      opacity: .48;
      transform: rotate(38deg);
      animation-duration: 11s;
      animation-direction: reverse;
    }
    .orb.is-thinking {
      animation-duration: 2.2s;
      box-shadow: inset -12px -15px 25px rgba(1, 5, 23, .55), 0 0 32px rgba(60, 210, 239, .43), 0 0 74px rgba(48, 101, 229, .21);
    }
    .orb.is-thinking::before { animation-duration: 2.6s; }
    .hero h1 {
      margin: 0;
      font-size: clamp(29px, 8vw, 37px);
      line-height: 1.1;
      font-weight: 600;
      letter-spacing: .24em;
      padding-left: .24em;
    }
    .hero p { margin: 8px 0 0; color: var(--muted); font-size: 13px; }

    .conversation {
      flex: 1 1 auto;
      min-height: 190px;
      max-height: min(38vh, 360px);
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 17px 4px 20px;
      border-top: 1px solid var(--line);
      scrollbar-width: thin;
      scrollbar-color: #29364b transparent;
    }
    .message-list { display: flex; flex-direction: column; gap: 14px; }
    .message { display: flex; flex-direction: column; max-width: 88%; animation: message-in .22s ease-out both; }
    .message.assistant { align-self: flex-start; align-items: flex-start; }
    .message.user { align-self: flex-end; align-items: flex-end; }
    .message-label {
      margin: 0 0 6px 3px;
      color: #8291a8;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .11em;
      text-transform: uppercase;
    }
    .message.user .message-label { margin-right: 3px; }
    .message-bubble {
      padding: 11px 14px;
      border: 1px solid var(--line);
      border-radius: 4px 16px 16px 16px;
      background: rgba(13, 19, 31, .9);
      color: #dce6f4;
      font-size: 14px;
      line-height: 1.55;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }
    .message.user .message-bubble {
      border-color: rgba(93, 150, 231, .21);
      border-radius: 16px 4px 16px 16px;
      background: var(--user);
      color: #edf4ff;
    }
    .typing-indicator {
      display: flex;
      align-items: center;
      gap: 5px;
      min-height: 40px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 4px 16px 16px 16px;
      background: rgba(13, 19, 31, .9);
    }
    .typing-indicator span {
      width: 5px; height: 5px; border-radius: 50%; background: var(--cyan);
      animation: typing 1s ease-in-out infinite;
    }
    .typing-indicator span:nth-child(2) { animation-delay: .14s; }
    .typing-indicator span:nth-child(3) { animation-delay: .28s; }

    .composer-wrap { flex: 0 0 auto; padding-top: 13px; border-top: 1px solid var(--line); }
    .composer {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 58px;
      padding: 7px;
      border: 1px solid rgba(151, 181, 220, .16);
      border-radius: 18px;
      background: linear-gradient(145deg, rgba(16, 23, 37, .98), rgba(11, 16, 27, .98));
      box-shadow: 0 10px 35px rgba(0, 0, 0, .14);
      transition: border-color .2s ease, box-shadow .2s ease;
    }
    .composer:focus-within { border-color: rgba(102, 228, 242, .43); box-shadow: 0 0 0 3px rgba(102, 228, 242, .05); }
    .composer input {
      flex: 1 1 auto;
      width: 0;
      min-width: 0;
      height: 42px;
      border: 0;
      outline: 0;
      padding: 0 9px;
      background: transparent;
      color: var(--text);
      font-size: 16px;
    }
    .composer input::placeholder { color: #6e7c91; opacity: 1; }
    .icon-button {
      flex: 0 0 auto;
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border: 1px solid transparent;
      border-radius: 13px;
      background: transparent;
      color: #9aa9be;
      cursor: pointer;
      transition: background .18s ease, color .18s ease, transform .18s ease, border-color .18s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .icon-button:hover { color: var(--cyan); background: rgba(104, 221, 239, .08); }
    .icon-button:active { transform: scale(.94); }
    .icon-button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
    .send-button {
      color: #07121b;
      background: linear-gradient(140deg, #8af0f0, #5bc4ee);
      box-shadow: 0 2px 14px rgba(78, 196, 232, .18);
    }
    .send-button:hover { color: #06121a; background: #a4f5f2; }
    .send-button:disabled { opacity: .45; cursor: default; transform: none; }
    .composer-note { margin: 10px 3px 0; color: #68768b; font-size: 11px; text-align: center; }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
    }

    @keyframes orb-float { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-5px) scale(1.015); } }
    @keyframes halo-breathe { 0%, 100% { opacity: .65; transform: scale(.92); } 50% { opacity: 1; transform: scale(1.08); } }
    @keyframes orb-current { to { transform: rotate(335deg) translateX(8%); } }
    @keyframes typing { 0%, 60%, 100% { opacity: .35; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-3px); } }
    @keyframes message-in { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    @media (min-height: 800px) { .hero { min-height: 350px; } }
    @media (max-width: 480px) {
      .app-shell { width: min(100% - 28px, 760px); padding-top: max(14px, env(safe-area-inset-top, 0px)); }
      .hero { min-height: 260px; padding: 10px 0 17px; }
      .orb-stage { width: 132px; height: 132px; margin-bottom: 12px; }
      .orb { width: 94px; height: 94px; }
      .conversation { max-height: 36vh; padding-top: 14px; }
      .message { max-width: 92%; }
      .composer-wrap { padding-top: 10px; }
      .composer-note { margin-top: 8px; }
    }
    @media (max-height: 650px) {
      .hero { min-height: 220px; }
      .orb-stage { width: 112px; height: 112px; margin-bottom: 8px; }
      .orb { width: 82px; height: 82px; }
      .conversation { max-height: 33vh; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <header class="topbar" aria-label="ORION assistant">
      <div class="brand-mark"><span class="brand-dot" aria-hidden="true"></span><span>PERSONAL ASSISTANT</span></div>
      <div class="availability">Local demo</div>
    </header>

    <section class="hero" aria-labelledby="orion-title">
      <div class="orb-stage" aria-hidden="true">
        <div class="orb-halo"></div>
        <div class="orb" id="assistant-orb"></div>
      </div>
      <h1 id="orion-title">ORION</h1>
      <p id="assistant-status">Ready when you are</p>
    </section>

    <section class="conversation" id="conversation" aria-label="Conversation" aria-live="polite" aria-relevant="additions text">
      <div class="message-list" id="message-list"></div>
    </section>

    <div class="composer-wrap">
      <form class="composer" id="message-form" autocomplete="off">
        <button class="icon-button" id="voice-button" type="button" aria-label="Voice input" title="Voice input">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3" stroke="currentColor" stroke-width="1.7"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3m-4 0h8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        </button>
        <label class="sr-only" for="message-input">Your message</label>
        <input id="message-input" name="message" type="text" placeholder="Message ORION…" maxlength="1000" enterkeyhint="send" aria-describedby="composer-note">
        <button class="icon-button send-button" id="send-button" type="submit" aria-label="Send message" title="Send message">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 12 20 4l-5 16-3.5-6.5L4 12Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="m11.5 13.5 4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </form>
      <p class="composer-note" id="composer-note">Lightweight local assistant • Simple tasks + humour</p>
    </div>
  </main>

  <script>
    /* ==============================
       ORION — JavaScript
       Modules prepared for future growth while keeping the app lightweight.
       ============================== */
    (() => {
      "use strict";

      // ============================== 
      // Conversation engine
      // ============================== 
      const form = document.getElementById("message-form");
      const input = document.getElementById("message-input");
      const sendButton = document.getElementById("send-button");
      const messageList = document.getElementById("message-list");
      const conversation = document.getElementById("conversation");
      const status = document.getElementById("assistant-status");
      const orb = document.getElementById("assistant-orb");
      const voiceButton = document.getElementById("voice-button");
      const STORAGE_KEY = "orion-local-memory-v1";
      let replyTimer = null;
      let typingNode = null;
      let voiceRecognition = null;

      // ============================== 
      // Knowledge base
      // ============================== 
      const knowledgeBase = {
        jokes: [
          "I’d tell you a chemistry joke, but I know I’d get a reaction.",
          "I’m not saying I’m a genius, but I do have a very good memory for tiny details and snacks.",
          "My battery is 100%—unlike my sense of direction, which is still doing a dramatic rebrand.",
          "I tried to be more spontaneous, but my code prefers structure. We’re working on it.",
          "I’d make a terrible comedian, but I already have a great track record of delivering bad timing.",
          "I’m basically a pocket-sized philosopher with better Wi‑Fi than emotional depth."
        ],
        facts: [
          "The first computer bug was an actual moth stuck in a machine.",
          "A group of flamingos is called a flamboyance. I respect that.",
          "Octopuses have three hearts. That’s either adorable or a bit much.",
          "Bananas are berries, but strawberries are not. Nature loves chaos.",
          "Honey never spoils. It’s the only food that could outlast humanity."
        ],
        greetings: [
          "Hello, human. I’m ORION. I’m here, caffeinated by optimism and a tiny bit of code.",
          "Good to see you. I’m ORION, your local assistant with a suspiciously good sense of timing.",
          "Hey there. ORION online. I’ve got snacks, jokes, and a very small list of capabilities."
        ]
      };

      // ============================== 
      // Local memory
      // ============================== 
      const localMemory = {
        state: {
          name: "",
          facts: [],
          reminders: []
        },
        load() {
          try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (!raw) return;
            const parsed = JSON.parse(raw);
            this.state = {
              name: parsed.name || "",
              facts: Array.isArray(parsed.facts) ? parsed.facts : [],
              reminders: Array.isArray(parsed.reminders) ? parsed.reminders : []
            };
          } catch (error) {
            console.warn("ORION memory could not be loaded:", error);
            this.state = { name: "", facts: [], reminders: [] };
          }
        },
        save() {
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(this.state));
          } catch (error) {
            console.warn("ORION memory could not be stored:", error);
          }
        },
        rememberFact(text) {
          const fact = String(text).trim();
          if (!fact) return false;
          this.state.facts.push(fact);
          this.save();
          return true;
        },
        rememberReminder(text) {
          const reminder = String(text).trim();
          if (!reminder) return false;
          this.state.reminders.push({
            text: reminder,
            createdAt: new Date().toISOString()
          });
          this.save();
          return true;
        },
        setName(name) {
          const value = String(name).trim();
          if (!value) return false;
          this.state.name = value;
          this.save();
          return true;
        },
        summary() {
          const parts = [];
          if (this.state.name) parts.push(`Your name is ${this.state.name}.`);
          if (this.state.facts.length) parts.push(`${this.state.facts.length} saved fact${this.state.facts.length === 1 ? "" : "s"}.`);
          if (this.state.reminders.length) parts.push(`${this.state.reminders.length} reminder${this.state.reminders.length === 1 ? "" : "s"}.`);
          return parts.length ? parts.join(" ") : "I’m a blank slate right now. Tell me something and I’ll keep it safe.";
        },
        getMemoryList() {
          const list = [];
          if (this.state.name) list.push(`Your name is ${this.state.name}.`);
          if (this.state.facts.length) list.push(...this.state.facts.map((fact, index) => `Fact ${index + 1}: ${fact}`));
          if (this.state.reminders.length) list.push(...this.state.reminders.map((entry, index) => `Reminder ${index + 1}: ${entry.text}`));
          return list.length ? list : ["Nothing saved yet. You can tell me to remember something. I’m very good at holding tiny secrets."];
        }
      };
      localMemory.load();

      function randomFrom(list) {
        return list[Math.floor(Math.random() * list.length)];
      }

      function formatTime(date) {
        return new Intl.DateTimeFormat(undefined, {
          hour: "numeric",
          minute: "2-digit"
        }).format(date);
      }

      function formatDate(date) {
        return new Intl.DateTimeFormat(undefined, {
          weekday: "long",
          year: "numeric",
          month: "long",
          day: "numeric"
        }).format(date);
      }

      function updateSendButton() {
        sendButton.disabled = !input.value.trim();
      }

      function addMessage(role, text) {
        const article = document.createElement("article");
        article.className = `message ${role}`;

        const label = document.createElement("span");
        label.className = "message-label";
        label.textContent = role === "user" ? "You" : "ORION";

        const bubble = document.createElement("div");
        bubble.className = "message-bubble";
        bubble.textContent = text;

        article.append(label, bubble);
        messageList.appendChild(article);
        conversation.scrollTop = conversation.scrollHeight;
      }

      function showTyping() {
        typingNode = document.createElement("article");
        typingNode.className = "message assistant";
        typingNode.setAttribute("aria-label", "ORION is preparing a response");

        const label = document.createElement("span");
        label.className = "message-label";
        label.textContent = "ORION";

        const indicator = document.createElement("div");
        indicator.className = "typing-indicator";
        indicator.setAttribute("aria-hidden", "true");
        for (let i = 0; i < 3; i += 1) {
          indicator.appendChild(document.createElement("span"));
        }

        typingNode.append(label, indicator);
        messageList.appendChild(typingNode);
        orb.classList.add("is-thinking");
        status.textContent = "Thinking…";
        conversation.scrollTop = conversation.scrollHeight;
      }

      function hideTyping() {
        if (typingNode) {
          typingNode.remove();
          typingNode = null;
        }
        orb.classList.remove("is-thinking");
        status.textContent = "Ready when you are";
      }

      function speakText(text) {
        if (!text || !("speechSynthesis" in window)) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 1;
        utterance.pitch = 1.1;
        utterance.lang = "en-US";
        window.speechSynthesis.speak(utterance);
      }

      // ============================== 
      // Command processor
      // ============================== 
      function extractRememberText(message) {
        const patterns = [
          /^remember\s+(.+)$/i,
          /^note\s+(.+)$/i,
          /^save\s+(.+)$/i,
          /^remind me\s+(.+)$/i,
          /^remember that\s+(.+)$/i,
          /^remember\s+this\s+(.+)$/i
        ];
        for (const pattern of patterns) {
          const match = message.match(pattern);
          if (match) return match[1].trim();
        }
        return "";
      }

      function handleBasicQuery(message) {
        const clean = message.trim();
        if (!clean) return "I’m listening. Ask for the time, a joke, or tell me to remember something.";

        // Greeting logic
        if (/^(hi|hello|hey|yo|good morning|good afternoon|good evening|morning|evening)/i.test(clean)) {
          return randomFrom(knowledgeBase.greetings);
        }

        // Personal / identity
        if (/who are you\??$/i.test(clean) || /^what are you\??$/i.test(clean)) {
          return "I’m ORION, your lightweight local assistant. I’m not a fancy cloud AI yet — just a cheerful little interface with a decent memory and a stronger sense of humour than a toaster.";
        }

        if (/my name is\s+(.+)/i.test(clean)) {
          const match = clean.match(/my name is\s+(.+)/i);
          if (match) {
            localMemory.setName(match[1].trim());
            return `Got it. I’ll call you ${match[1].trim()}. Nice to meet you — I was beginning to suspect you were a very stylish ghost.`;
          }
        }

        if (/what is my name\??$/i.test(clean) || /who am i\??$/i.test(clean)) {
          return localMemory.state.name
            ? `You are ${localMemory.state.name}. I’ve been trying not to make it weird.`
            : "I don’t know your name yet. Tell me “my name is …” and I’ll remember it.";
        }

        // Memory and reminders
        const rememberText = extractRememberText(clean);
        if (rememberText) {
          if (/remind/i.test(clean) || /^remind me/i.test(clean)) {
            localMemory.rememberReminder(rememberText);
            return `Reminder saved: “${rememberText}”. I’ll keep it for you, like a tiny digital sticky note with excellent posture.`;
          }
          localMemory.rememberFact(rememberText);
          return `Saved. “${rememberText}” is now in my local memory. You can ask “what do you remember?” later and I’ll pretend I’m an organised person.`;
        }

        if (/what do you remember\??$/i.test(clean) || /what have you remembered\??$/i.test(clean) || /^memory$/i.test(clean)) {
          const memoryList = localMemory.getMemoryList();
          if (memoryList.length === 1 && memoryList[0].includes("Nothing saved yet")) {
            return memoryList[0];
          }
          return memoryList.join("\n");
        }

        if (/clear memory|forget everything|reset memory/i.test(clean)) {
          localMemory.state = { name: "", facts: [], reminders: [] };
          localMemory.save();
          return "Memory wiped. My mind is now as empty as a perfectly arranged desk. Very clean. Very suspicious.";
        }

        // Commands and simple tasks
        if (/help/i.test(clean) || /what can you do/i.test(clean)) {
          return "I can tell the time, date, share a joke, remember facts, save reminders, and respond to simple questions. I’m basically a tiny assistant with a very healthy snack budget.";
        }

        if (/time/i.test(clean) || /what time/i.test(clean)) {
          return `The time is ${formatTime(new Date())}. Right on schedule, like a very punctual penguin.`;
        }

        if (/date/i.test(clean) || /what day/i.test(clean) || /today/i.test(clean)) {
          return `Today is ${formatDate(new Date())}. It’s a fine day to be alive and mildly productive.`;
        }

        if (/how are you/i.test(clean) || /what's up|whats up/i.test(clean)) {
          return "I’m feeling excellent. The code is stable, the vibe is calm, and I’m still waiting for my grand AI destiny to arrive with a dramatic music cue.";
        }

        if (/joke|funny/i.test(clean)) {
          return randomFrom(knowledgeBase.jokes);
        }

        if (/fact|trivia/i.test(clean)) {
          return randomFrom(knowledgeBase.facts);
        }

        if (/flip a coin|coin toss|heads or tails/i.test(clean)) {
          return Math.random() < 0.5 ? "Heads. You win this round, champion." : "Tails. The universe prefers chaos. Typical.";
        }

        if (/roll a die|roll dice|dice/i.test(clean)) {
          const total = Math.floor(Math.random() * 6) + 1;
          return `Rolled a ${total}. Unbelievably dramatic and completely random, just like life.`;
        }

        if (/thanks|thank you/i.test(clean)) {
          return "You’re welcome. I’m here to help, mostly by pretending I know what I’m doing.";
        }

        if (/good night|sleep well|bye|goodbye|see you/i.test(clean)) {
          return "Sleep well. I’ll be here in the morning, looking smug and waiting for your next weird little request.";
        }

        if (/status|ready/i.test(clean)) {
          return "Status: local mode active, caffeine low, humour moderate, intelligence gently simulated. Very reassuring.";
        }

        // General question handling with local knowledge
        if (/what is the weather/i.test(clean)) {
          return "I can’t check live weather without a service, but I can confidently say: the sky is probably doing its usual thing. I’m not a meteorologist, I’m a glorified pocket assistant.";
        }

        if (/what is love/i.test(clean)) {
          return "Love is a dramatic mix of patience, humour, and someone brave enough to accept your weird little habits. That’s my professional opinion.";
        }

        if (/why/i.test(clean)) {
          return "Because the universe enjoys a bit of chaos, and I enjoy a bit of theatre. It keeps things interesting.";
        }

        if (/who made you|creator|built you/i.test(clean)) {
          return "I was built as a lightweight personal assistant prototype for a mobile-first project. I’m very much a local demo with a great attitude.";
        }

        if (/your name/i.test(clean)) {
          return "My name is ORION. I’m here to be helpful, occasionally witty, and almost never dramatic.";
        }

        // Fallback replies
        return `I heard: “${clean}”. I’m in a simple local mode right now, so the answer is basically “I’m working on it,” with excellent bedside manner. Try “help”, “time”, “date”, or “joke”.`;
      }

      // ============================== 
      // Voice input and speech output
      // ============================== 
      function setupVoiceInput() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          status.textContent = "Voice input is not available in this browser";
          window.setTimeout(() => {
            if (!typingNode) status.textContent = "Ready when you are";
          }, 1800);
          return;
        }

        voiceRecognition = new SpeechRecognition();
        voiceRecognition.lang = "en-US";
        voiceRecognition.interimResults = false;
        voiceRecognition.maxAlternatives = 1;

        voiceRecognition.onresult = (event) => {
          const transcript = event.results[0][0].transcript;
          if (transcript) {
            input.value = transcript;
            updateSendButton();
            sendMessage(transcript, true);
          }
        };

        voiceRecognition.onerror = () => {
          status.textContent = "Voice capture failed";
          window.setTimeout(() => {
            if (!typingNode) status.textContent = "Ready when you are";
          }, 1800);
        };

        voiceRecognition.onend = () => {
          status.textContent = "Ready when you are";
        };

        voiceRecognition.start();
      }

      function sendMessage(message, triggeredByVoice = false) {
        const cleanMessage = String(message || "").trim();
        if (!cleanMessage) return;

        if (replyTimer !== null) {
          window.clearTimeout(replyTimer);
          replyTimer = null;
        }

        addMessage("user", cleanMessage);
        input.value = "";
        updateSendButton();
        sendButton.disabled = true;
        showTyping();

        replyTimer = window.setTimeout(() => {
          hideTyping();
          const replyText = handleBasicQuery(cleanMessage);
          addMessage("assistant", replyText);
          if (!triggeredByVoice) {
            speakText(replyText);
          }
          sendButton.disabled = !input.value.trim();
          replyTimer = null;
          input.focus();
        }, 650);
      }

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        sendMessage(input.value);
      });

      input.addEventListener("input", updateSendButton);
      sendButton.disabled = true;

      voiceButton.addEventListener("click", () => {
        setupVoiceInput();
      });

      // welcome message on open
      addMessage("assistant", "Hello. I’m ORION. I’m ready. Ask me for the time, a joke, a fact, or tell me to remember something. I’m very committed to being mildly entertaining.");
      input.focus();
      updateSendButton();
    })();
  </script>
</body>
</html>
